<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jessica Muñiz Witmer — Product Designer</title>
    <meta
      name="description"
      content="Portfolio of Jessica Muñiz Witmer, product designer."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="split hero" id="hello">
        <div class="photo photo-sunflower" data-sunflower data-scene="video">
          <div class="sunflower-color" aria-hidden="true"></div>
          <video class="sunflower-video" muted playsinline loop preload="none" aria-hidden="true"></video>
          <button class="sunflower-trigger" type="button" aria-label="Show the sunflower color"></button>
        </div>
        <div class="copy hero-copy">
          <p class="eyebrow hero-name">Jessica Muñiz Witmer</p>
          <div class="copy-inner hero-intro">
            <h1>Hello!</h1>
            <p class="intro">
              I am a Product Designer creating beautiful experiences that move
              businesses forward through meaningful human connections.
            </p>
          </div>
          <nav class="home-menu" aria-label="Contact">
            <a href="mailto:jessica@colorhive.com">Contact Jessica</a>
          </nav>
        </div>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
